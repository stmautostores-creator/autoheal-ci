<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoHeal CI — Slides</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #1f2328;
      color: #f7f8fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .slide {
      background: #2d333b;
      border: 1px solid #444c56;
      border-radius: 10px;
      padding: 3rem;
      max-width: 720px;
      width: 100%;
      text-align: center;
    }
    .slide h1 { font-size: 2rem; margin-bottom: 1rem; color: #e6edf3; }
    .slide p  { font-size: 1.1rem; color: #adbac7; line-height: 1.7; }
    .badge {
      display: inline-block;
      background: #3b82d4;
      color: #fff;
      border-radius: 4px;
      padding: 0.2rem 0.7rem;
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="slide">
    <h1>AutoHeal CI</h1>
    <p>
      Automatically detects failing tests in CI, invokes an AI-powered healing
      step, and commits a fixed test file back to the repository — keeping your
      pipeline green without manual intervention.
    </p>
    <span class="badge">v1.0.0</span>
  </div>
</body>
</html>
